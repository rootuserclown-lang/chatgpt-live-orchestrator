<!doctype html><html><head><meta charset="utf-8"><title>Orchestrator</title><style>body{font:13px system-ui;margin:0;background:#101010;color:#eee}header{padding:12px;border-bottom:1px solid #333;font-weight:700}section{padding:10px 12px;border-bottom:1px solid #292929}button,select,textarea,input{background:#181818;color:#eee;border:1px solid #555;border-radius:7px;padding:8px}button{cursor:pointer;margin:3px}textarea{width:100%;box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:4px}pre{white-space:pre-wrap;background:#181818;padding:8px;border-radius:7px}.small{font-size:11px;color:#aaa}</style></head><body><header>⚡ ChatGPT Local Orchestrator</header><section><b>Workflow</b><select id="workflow"><option>SALT Capability Investigation</option></select><div class="row"><button id="continue">Continue</button><button id="newchat">Open ChatGPT</button></div></section><section><b>Chat</b><textarea id="prompt" rows="4" placeholder="Type an instruction…"></textarea><div class="row"><button id="send">Send</button><button id="mic">🎙 Voice</button><button id="stop" disabled>■</button><label><input id="speak" type="checkbox"> Speak</label></div><div id="voice" class="small"></div></section><section><b>Execution parameters</b><div class="row"><label><input id="confirm" type="checkbox" checked> Confirm machine actions</label><label><input id="browser" type="checkbox" checked> Allow browser actions</label><label><input id="local" type="checkbox"> Allow local companion actions</label></div><div class="small">Local actions are opt-in and require a separately installed, allowlisted companion.</div></section><section><b>Execution trace</b><pre id="trace">Ready.</pre></section><section><b>Latest visible response</b><pre id="response">No response captured.</pre></section><script src="sidepanel.js"></script></body></html>
