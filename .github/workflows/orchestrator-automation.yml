name: Orchestrator Production Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upgrade background router
        shell: bash
        run: |
          cat > background.js <<'EOF'
          const CHATGPT_HOSTS = new Set(["chatgpt.com", "chat.openai.com"]);
          const CHATGPT_URL = "https://chatgpt.com/";

          function isChatGPTUrl(url = "") {
            try {
              const u = new URL(url);
              return u.protocol === "https:" && CHATGPT_HOSTS.has(u.hostname);
            } catch {
              return false;
            }
          }

          async function findChatGPTTab() {
            const tabs = await chrome.tabs.query({});
            const candidates = tabs.filter(t => isChatGPTUrl(t.url));
            if (!candidates.length) return null;

            const complete = candidates.filter(t => t.status === "complete");

            return (complete.length ? complete : candidates)
              .sort((a, b) => (b.id ?? 0) - (a.id ?? 0))[0] || null;
          }

          async function openOrReuseChatGPT() {
            const existing = await findChatGPTTab();

            if (existing?.id != null) {
              await chrome.tabs.update(existing.id, { active: true });

              if (existing.windowId != null) {
                await chrome.windows.update(existing.windowId, { focused: true });
              }

              return existing;
            }

            return chrome.tabs.create({
              url: CHATGPT_URL,
              active: true
            });
          }

          chrome.runtime.onInstalled.addListener(() => {
            chrome.storage.local.get(["workflows"], r => {
              if (!r.workflows) {
                chrome.storage.local.set({ workflows: {} });
              }
            });

            chrome.sidePanel
              .setPanelBehavior({ openPanelOnActionClick: true })
              .catch(console.error);
          });

          chrome.runtime.onStartup.addListener(() => {
            chrome.sidePanel
              .setPanelBehavior({ openPanelOnActionClick: true })
              .catch(console.error);
          });

          chrome.action.onClicked.addListener(async tab => {
            try {
              await chrome.sidePanel.open({ windowId: tab.windowId });
            } catch (e) {
              console.error("Could not open side panel:", e);
            }
          });

          chrome.runtime.onMessage.addListener((msg, sender, reply) => {
            if (msg?.type === "OPEN_CHATGPT") {
              openOrReuseChatGPT()
                .then(tab => reply({
                  ok: true,
                  tabId: tab?.id ?? null,
                  reused: !!tab
                }))
                .catch(e => reply({
                  ok: false,
                  error: e.message
                }));

              return true;
            }

            if (msg?.type === "FIND_CHATGPT") {
              findChatGPTTab()
                .then(tab => reply({
                  ok: true,
                  tabId: tab?.id ?? null,
                  windowId: tab?.windowId ?? null,
                  url: tab?.url ?? null
                }))
                .catch(e => reply({
                  ok: false,
                  error: e.message
                }));

              return true;
            }
          });
          EOF

      - name: Upgrade ChatGPT bridge
        shell: bash
        run: |
          cat > content.js <<'EOF'
          (() => {
            function visible(el) {
              if (!el) return false;

              const r = el.getBoundingClientRect();
              const s = getComputedStyle(el);

              return (
                r.width > 100 &&
                r.height > 20 &&
                s.display !== "none" &&
                s.visibility !== "hidden"
              );
            }

            function findComposer() {
              const candidates = [
                ...document.querySelectorAll("textarea"),
                ...document.querySelectorAll(
                  'div[contenteditable="true"][role="textbox"]'
                ),
                ...document.querySelectorAll(
                  'div[contenteditable="true"]'
                )
              ];

              return candidates.filter(visible).pop() || null;
            }

            function setText(el, text) {
              el.focus();

              if (el.tagName === "TEXTAREA") {
                const setter =
                  Object.getOwnPropertyDescriptor(
                    HTMLTextAreaElement.prototype,
                    "value"
                  )?.set;

                if (setter) setter.call(el, text);
                else el.value = text;
              } else {
                el.textContent = text;
              }

              el.dispatchEvent(
                new InputEvent("input", {
                  bubbles: true,
                  inputType: "insertText",
                  data: text
                })
              );

              el.dispatchEvent(new Event("change", { bubbles: true }));
            }

            function findSendButton() {
              return [
                ...document.querySelectorAll("button,[role='button']")
              ].find(button => {
                if (!visible(button)) return false;

                const text = (
                  (button.getAttribute("aria-label") || "") +
                  " " +
                  (button.innerText || "")
                ).toLowerCase();

                return /send|submit/.test(text) && !/stop/.test(text);
              });
            }

            function clickSend() {
              const button = findSendButton();

              if (!button) return false;

              button.click();
              return true;
            }

            function captureResponse() {
              const nodes = [
                ...document.querySelectorAll(
                  '[data-message-author-role="assistant"]'
                ),
                ...document.querySelectorAll(".markdown")
              ];

              const texts = nodes
                .filter(visible)
                .map(e => (e.innerText || "").trim())
                .filter(Boolean);

              return [...new Set(texts)].pop() || "";
            }

            async function waitForComposer(timeout = 10000) {
              const start = Date.now();

              while (Date.now() - start < timeout) {
                const composer = findComposer();

                if (composer) return composer;

                await new Promise(resolve => setTimeout(resolve, 250));
              }

              return null;
            }

            chrome.runtime.onMessage.addListener((msg, sender, reply) => {
              if (msg?.type === "PING_CHATGPT") {
                reply({
                  ok: true,
                  ready: !!findComposer()
                });
                return;
              }

              if (msg?.type === "SEND_PROMPT") {
                (async () => {
                  const composer = await waitForComposer();

                  if (!composer) {
                    reply({
                      ok: false,
                      error: "ChatGPT composer did not become ready."
                    });
                    return;
                  }

                  setText(composer, msg.text);

                  await new Promise(resolve => setTimeout(resolve, 300));

                  if (!clickSend()) {
                    reply({
                      ok: false,
                      error: "ChatGPT send button was not available."
                    });
                    return;
                  }

                  reply({
                    ok: true
                  });
                })();

                return true;
              }

              if (msg?.type === "CAPTURE_RESPONSE") {
                reply({
                  ok: true,
                  text: captureResponse()
                });
              }
            });
          })();
          EOF

      - name: Upgrade side panel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("sidepanel.js")
          s = p.read_text()

          s = s.replace(
              '''async function activeChat(){const tabs=await chrome.tabs.query({active:true,lastFocusedWindow:true});const tab=tabs[0];if(!tab||!/^https:\\/\\/(chatgpt\\\\.com|chat\\\\.openai\\\\.com)\\\\//.test(tab.url||""))throw new Error("Active tab is not ChatGPT. Use Open ChatGPT or switch to a ChatGPT tab.");return tab;}''',
              '''async function activeChat(){
                const result=await chrome.runtime.sendMessage({type:"FIND_CHATGPT"});
                if(result?.ok&&result.tabId!=null){
                  return await chrome.tabs.get(result.tabId);
                }
                const opened=await chrome.runtime.sendMessage({type:"OPEN_CHATGPT"});
                if(!opened?.ok||opened.tabId==null)throw new Error(opened?.error||"Could not locate ChatGPT.");
                return await chrome.tabs.get(opened.tabId);
              }'''
          )

          s = s.replace(
              '''async function sendText(text){const tab=await activeChat();const r=await chrome.tabs.sendMessage(tab.id,{type:"SEND_PROMPT",text});if(!r?.ok)throw new Error(r?.error||"Could not send.");log("EXECUTE","Submitted prompt through the visible ChatGPT UI.");}''',
              '''async function sendText(text){
                const tab=await activeChat();
                let r;
                try{
                  r=await chrome.tabs.sendMessage(tab.id,{type:"SEND_PROMPT",text});
                }catch(e){
                  throw new Error("ChatGPT bridge is not ready. Reload the ChatGPT tab and try again.");
                }
                if(!r?.ok)throw new Error(r?.error||"Could not send.");
                log("EXECUTE","Submitted prompt through the visible ChatGPT UI.");
              }'''
          )

          s = s.replace(
              '''$(\"newchat\").onclick=()=>chrome.runtime.sendMessage({type:"OPEN_CHATGPT"},r=>r?.ok?log("ROUTE","Opened a ChatGPT tab."):log("ERROR",r?.error||"Could not open ChatGPT."));''',
              '''$(\"newchat\").onclick=async()=>{
                try{
                  const r=await chrome.runtime.sendMessage({type:"OPEN_CHATGPT"});
                  if(!r?.ok)throw new Error(r?.error||"Could not open ChatGPT.");
                  log("ROUTE","Located or opened the ChatGPT target.");
                }catch(e){
                  log("ERROR",e.message);
                }
              };'''
          )

          p.write_text(s)
          PY

      - name: Validate manifest
        run: |
          node -e "const m=require('./manifest.json'); if(m.manifest_version !== 3) process.exit(1); console.log('Manifest OK:', m.name, m.version)"

      - name: Validate source files
        run: |
          test -s background.js
          test -s content.js
          test -s sidepanel.js
          test -s sidepanel.html
          echo "Extension source validation passed."

      - name: Package extension
        run: |
          rm -f chatgpt-local-orchestrator-production.zip
          zip -r chatgpt-local-orchestrator-production.zip \
            manifest.json \
            background.js \
            content.js \
            sidepanel.html \
            sidepanel.js \
            README.txt \
            LOCAL_COMPANION_SPEC.md \
            -x "*.DS_Store"

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            background.js \
            content.js \
            sidepanel.js \
            chatgpt-local-orchestrator-production.zip

          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "Build resilient ChatGPT orchestrator"
            git push
          fi
